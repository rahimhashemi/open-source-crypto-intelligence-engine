# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
  pull_request:

permissions:
  contents: read
  # dependency-graph: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show Java & Maven
        run: |
          java -version
          mvn -version

      - name: Build (must succeed)
        run: mvn -B -U -DskipTests clean verify

      - name: Submit dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4
        with:
          # If your pom.xml is NOT at repo root, set the directory:
          # directory: path/to/maven/root
          maven-args: -DskipTests
