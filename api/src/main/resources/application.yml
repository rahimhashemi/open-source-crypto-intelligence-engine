server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cryptointel
    username: cryptointel
    password: cryptointel
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration