services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cryptointel}
      POSTGRES_USER: ${POSTGRES_USER:-cryptointel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptointel}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cryptointel}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cryptointel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cryptointel}
      COINEX_BASE_URL: ${COINEX_BASE_URL:-https://api.coinex.com/v2}
      COINEX_TIMEOUT: ${COINEX_TIMEOUT:-5s}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
