services:
  db:
    image: postgres:16
    container_name: crypto-intel-db
    environment:
      POSTGRES_DB: cryptointel
      POSTGRES_USER: cryptointel
      POSTGRES_PASSWORD: cryptointel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptointel"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: